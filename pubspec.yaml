name: lynewed_beta
description: A new Flutter project.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.2.4+70

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Core
  collection: 1.19.1
  intl: 0.20.2
  provider: 6.1.5
  rxdart: 0.27.7
  synchronized: 3.4.0

  # Backend - Supabase
  supabase: 2.7.0
  supabase_flutter: 2.9.0
  gotrue: 2.12.0
  postgrest: 2.4.2
  realtime_client: 2.5.0
  storage_client: 2.4.0
  functions_client: 2.4.2

  # Backend - Firebase
  firebase_core: ^3.14.0
  firebase_messaging: ^15.2.7

  # Navigation
  go_router: 12.1.3
  app_links: 6.3.2

  # UI Components
  flutter_animate: 4.5.0
  auto_size_text: 3.0.0
  dropdown_button2: 2.3.9
  font_awesome_flutter: 10.7.0
  smooth_page_indicator: 1.1.0
  page_transition: 2.1.0
  aligned_dialog: 0.0.6
  google_fonts: 6.1.0
  cupertino_icons: ^1.0.0
  from_css_color: 2.0.0

  # Forms & Input
  mask_text_input_formatter: 2.9.0
  easy_debounce: 2.0.1

  # Images & Media
  cached_network_image: 3.4.1
  flutter_cache_manager: 3.4.1
  flutter_image_compress: ^2.0.4
  image_picker: ^1.0.7
  video_player: ^2.9.1
  youtube_player_flutter: ^9.1.3
  just_audio: ^0.10.4
  record: ^6.0.0

  # Maps & Location
  google_maps_flutter: ^2.12.2
  flutter_google_places_sdk: ^0.4.2+1
  geolocator: ^14.0.1

  # Video Calls
  agora_rtc_engine: 6.3.2

  # Storage & Persistence
  flutter_secure_storage: 10.0.0-beta.4
  shared_preferences: 2.5.3
  path_provider: 2.1.4

  # Auth
  sign_in_with_apple: 7.0.1

  # Permissions & Device
  permission_handler: 12.0.0+1
  device_info_plus: 11.5.0

  # Web & URLs
  url_launcher: 6.3.1
  webview_flutter: 4.13.0
  flutter_inappwebview: ^6.0.0

  # Files
  file_picker: ^8.0.0

  # Utilities
  uuid: ^4.5.1
  csv: 6.0.0
  timeago: 3.7.1
  flutter_dotenv: ^5.1.0
  flutter_app_badger: ^1.5.0
  in_app_review: ^2.0.11
  http: ^1.4.0
  crypto: ^3.0.6
dependency_overrides:
  http: 1.4.0
  rxdart: 0.27.7
  uuid: ^4.0.0

dev_dependencies:
  flutter_launcher_icons: 0.13.1
  flutter_lints: 4.0.0
  image: 4.2.0
  lints: 4.0.0
  flutter_test:
    sdk: flutter


flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  image_path: 'assets/images/app_launcher_icon.png'


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    # NOTE: .env removed for security - secrets now via --dart-define-from-file
    # NOTE: Removed unused asset directories (audios, videos, rive_animations, pdfs, jsons)
    - assets/fonts/
    - assets/images/

  fonts:
    - family: 'Haas Grot Text Trial'
      fonts:
        - asset: assets/fonts/NeueHaasGrotText-55Roman-Trial.otf
        - asset: assets/fonts/NeueHaasGrotText-56Italic-Trial.otf
          style: italic
        - asset: assets/fonts/NeueHaasGrotText-65Medium-Trial.otf
          weight: 500
        - asset: assets/fonts/NeueHaasGrotText-66MediumItalic-Trial.otf
          weight: 500
          style: italic
        - asset: assets/fonts/NeueHaasGrotText-75Bold-Trial.otf
          weight: 700
        - asset: assets/fonts/NeueHaasGrotText-76BoldItalic-Trial.otf
          weight: 700
          style: italic


  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages


# Sources for {{EPIC_ID}}
# Generated by /create-epic v6

epic: {{EPIC_ID}}
version: 1
created_at: {{DATE}}
last_updated: {{DATE}}

discovery:
  method: {{DISCOVERY_METHOD}}  # auto | manual
  confidence: {{CONFIDENCE}}    # high | medium | low

sources:
  primary:
    file: {{PRIMARY_FD_PATH}}
    sections:
{{#each PRIMARY_SECTIONS}}
      - "{{this}}"
{{/each}}
    mentions_in_prd: {{PRIMARY_MENTIONS_COUNT}}

  secondary:
{{#each SECONDARY_FDS}}
    - file: {{this.file}}
      relevance: {{this.relevance}}
      sections:
{{#each this.sections}}
        - "{{this}}"
{{/each}}
{{/each}}

  detailed:
{{#each DETAILED_DOCS}}
    - file: {{this.file}}
      type: {{this.type}}
{{/each}}

gaps:
{{#if GAPS}}
{{#each GAPS}}
  - description: "{{this.description}}"
    impact: {{this.impact}}
    action: "{{this.action}}"
{{/each}}
{{else}}
  []  # No gaps identified
{{/if}}

validation:
  status: approved
  by: user
  date: {{DATE}}

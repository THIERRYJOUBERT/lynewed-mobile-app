# Template: Workflow Manifest
#
# Purpose: Track metadata, decisions, and quality for generated workflows.
# This file provides traceability and helps with maintenance/updates.
#
# Usage: Copy this template and fill in the values for your workflow.

# ============================================================================
# TEMPLATE START
# ============================================================================

# Workflow Manifest
# Generated by /create-workflow v3

workflow:
  name: "{workflow_name}"                    # kebab-case identifier
  version: "1.0.0"                           # semantic version
  created: "{created_date}"                  # ISO 8601 date (YYYY-MM-DD)
  updated: "{updated_date}"                  # last modification date
  type: "{workflow_type}"                    # reference | task-simple | task-workflow

design:
  objective: "{objective}"                   # 1-2 sentence goal
  invocation: "{invocation}"                 # user or model-only
  trigger_description: "{trigger}"           # when to use this workflow

features:
  context_fork: {context_fork}               # true | false
  subagents: {subagents}                     # true | false
  hooks: {hooks}                             # true | false
  model: "{model}"                           # opus | sonnet | haiku

structure:
  files:
    - "SKILL.md"
    # Add step files if task-workflow:
    # - "steps/step-00-{name}.md"
    # - "steps/step-01-{name}.md"
    # Add template files if needed:
    # - "templates/{template}.md"
    # Add reference files if needed:
    # - "references/{reference}.md"
  step_count: {step_count}                   # 0 for reference/simple, N for workflow

patterns_applied:
  # List patterns from references/patterns-unified.md that this workflow uses
  - "{pattern_1}"                            # e.g., A1-Single-File-Simplicity
  - "{pattern_2}"                            # e.g., Q1-Self-Validation
  - "{pattern_3}"                            # e.g., R1-Self-Healing

quality:
  critique_iterations: {critique_iterations} # how many review cycles
  final_score: "{final_score}"               # PASS | PASS_WITH_WARNINGS | NEEDS_WORK
  remaining_issues:
    # List any known issues that were documented but not resolved
    # - "{issue_description}"
  warnings:
    # List any warnings for users of this workflow
    # - "{warning_description}"

decisions:
  # Document key design decisions made during creation
  - decision: "{decision_1_title}"
    rationale: "{decision_1_rationale}"
  - decision: "{decision_2_title}"
    rationale: "{decision_2_rationale}"

sources:
  # Document sources used during workflow creation
  - type: "{source_type_1}"                  # user-input | existing-workflow | documentation
    reference: "{source_reference_1}"        # path or description

metadata:
  generated_by: "/create-workflow v3"
  generation_mode: "{mode}"                  # create | update
  generator_version: "3.0.0"

# ============================================================================
# TEMPLATE END
# ============================================================================


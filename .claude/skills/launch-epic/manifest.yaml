# Workflow Manifest
name: launch-epic
version: "3.0.0"
description: "Lancer un Epic complet avec coordination chef. Modes supervised (interactif) et autonomous (Task-based orchestration)."
updated: "2026-02-02"

# Architecture
type: task-workflow
entry_point: SKILL.md

# Steps
steps:
  - step-00-init.md      # Initialisation + validation + error handling
  - step-01-supervised.md # Workflow interactif avec utilisateur
  - step-02-autonomous.md # NEW v3: Task-based orchestration avec workflows réels
  - step-03-review.md     # Review adversariale (commun)
  - step-04-finalize.md   # Finalisation Epic et rapport

# Dependencies
dependencies:
  skills:
    - dev-story     # Implémenter une story avec TDD
    - debug         # Résoudre un bug scientifiquement
    - oneshot       # Dev rapide APEX
    - exploration:explore  # Explorer le contexte
    - sync-project  # Synchroniser les références
    - documentation # Documenter le travail
  tools:
    - Task          # Lancer des subagents
    - Skill         # Invoquer des workflows
    - EnterPlanMode # Mode planification

# Model Configuration
models:
  default: opus
  finalization: sonnet  # Pour sync/doc

# Changelog
changelog:
  - version: "3.0.0"
    date: "2026-02-02"
    changes:
      - "BREAKING: Refonte complète du mode autonomous avec Task orchestration"
      - "NEW: Subagents peuvent utiliser les workflows réels (/dev-story, /debug, /oneshot, /exploration:explore)"
      - "NEW: Mode Plan disponible pour les subagents via EnterPlanMode"
      - "NEW: Stratégie de délégation intelligente selon le type de tâche"
      - "NEW: Self-healing adaptatif avec choix du workflow approprié"
      - "NEW: Possibilité de parallélisation des stories indépendantes"
      - "FIX: Model Opus par défaut pour tous les subagents"
      - "IMPROVED: Documentation des workflows utilisés dans TRACKING.md"
  - version: "2.0.0"
    date: "2026-01-24"
    changes:
      - "Migration vers architecture multi-file"
      - "Ajout sections AUTO-VALIDATION dans chaque step"
      - "Ajout ERROR HANDLING avec messages explicites"
      - "Documentation syntaxe Task tool pour story-executor"
  - version: "1.0.0"
    date: "2025-xx-xx"
    changes:
      - "Version initiale monolithique"

# Decisions techniques de cet Epic
decisions:
  - id: D-EPIC13-01
    decision: "minRating disabled par defaut (feature flag)"
    source: "Dependance EPIC-07 non deployee"
    rationale: "Permet de deployer EPIC-13 independamment"

  - id: D-EPIC13-02
    decision: "showMarketplace = false par defaut"
    source: "Dependance EPIC-14 non deployee"
    rationale: "Evite crash si pas de donnees marketplace"

  - id: D-EPIC13-03
    decision: "Couleur marketplace = purple (#7B1FA2)"
    source: "Design decision"
    rationale: "Distinction visuelle claire vs pink (wedding), green (pro), red (alert)"

  - id: D-EPIC13-04
    decision: "Index partiels sur colonnes boolean"
    source: "Performance optimization"
    rationale: "WHERE column = TRUE est plus frequent que FALSE, index partiel suffit"

  - id: D-EPIC13-05
    decision: "Filtres nullable (null = no filter)"
    source: "Best practice"
    rationale: "Preserve comportement existant, backward compatible"


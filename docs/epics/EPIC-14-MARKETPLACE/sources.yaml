# EPIC-14-MARKETPLACE - Sources de Reference
# Cree le: 2026-01-28

epic:
  id: EPIC-14-MARKETPLACE
  name: "Marketplace Robes & Chaussures (APP-08)"
  description: "Marketplace style Vinted pour vendre robes ET chaussures de mariage avec commission 10% Stripe Connect et expedition FedEx mondiale"
  status: draft
  created_at: "2026-01-28"
  estimated_days: 7
  estimated_cost: 2100

# Source PRD principale
prd:
  document: "docs/specs/MISSION-01-EVOLUTIONS-2026.md"
  version: "2.1 (Post-Challenge Deep)"
  sections_used:
    - section: "11. APP-08 - Marketplace Robes & Chaussures"
      description: "Specification complete de la marketplace"
      subsections:
        - "Structure de donnees (6 tables)"
        - "User Stories - Vendeuse (US-08.1 to US-08.9)"
        - "User Stories - Acheteuse (US-08.10 to US-08.18)"
        - "Stripe Connect - Onboarding Express"
        - "FedEx - Integration Complete (5 APIs)"
        - "Devises (USD cents)"
        - "UI/UX - Coherence"
        - "Responsabilite & Litiges"
        - "Criteres d'acceptation"
    - section: "8. APP-05 - Integration Stripe Complete"
      description: "Tables Stripe et webhooks"
      subsections:
        - "stripe_accounts table"
        - "purchases table"
        - "stripe_events table"
        - "Webhooks a gerer"
    - section: "12. CGVU & Conformite juridique"
      description: "Textes CGVU et tracabilite"
      subsections:
        - "Types de CGVU"
        - "Tracabilite (logs obligatoires)"
        - "Textes CGVU Marketplace vendeuse (EN)"
        - "Textes CGVU Marketplace acheteuse (EN)"
    - section: "14. Decisions de conception"
      decisions_used:
        - "D-07: USD comme devise interne (Simplifie Stripe et FedEx)"
        - "D-08: Tous webhooks Stripe geres (Securite, pas de cas non geres)"
        - "D-09: Marketplace dans navbar + preview home (Visibilite maximale)"
        - "D-10: Coherence UI avec my_wedding (Utilisateurs familiers)"
    - section: "15. Annexes techniques"
      subsections:
        - "A. Tables Supabase a creer/modifier"
        - "B. Edge Functions a creer"
        - "D.5 Marketplace RLS Policies"

# Dependances inter-epics
dependencies:
  blocking:
    - epic_id: EPIC-06-PREREQUISITES
      reason: "Enum userRole avec 'guest', colonnes invitation sur weddings"
      status: required_before_start
    - epic_id: EPIC-11-STRIPE
      reason: "Tables stripe_accounts, purchases, stripe_events"
      status: required_before_start
  optional:
    - epic_id: EPIC-13-MAP-FILTERS
      reason: "Marqueurs marketplace sur la carte"
      affected_stories: [S24]
      note: "S24 peut etre fait sans EPIC-13 mais perd l'integration carte"

# External services required
external_services:
  stripe:
    type: "Payment processor"
    features_required:
      - "Stripe Connect Express accounts"
      - "Payment Intents"
      - "Transfers with application fees"
      - "Webhooks (account.updated, payment_intent.succeeded, etc.)"
    credentials_needed:
      - "STRIPE_SECRET_KEY"
      - "STRIPE_PUBLISHABLE_KEY"
      - "STRIPE_WEBHOOK_SECRET"
    documentation: "https://stripe.com/docs/connect"

  fedex:
    type: "Shipping carrier"
    apis_required:
      - name: "Address Validation API"
        description: "Verify shipping addresses before label creation"
      - name: "Rate API"
        description: "Calculate shipping costs for display to buyer"
      - name: "Ship API"
        description: "Create shipments and generate labels"
      - name: "Track API"
        description: "Track package status updates"
      - name: "Pickup API"
        description: "Schedule package pickup (optional)"
    credentials_needed:
      - "FEDEX_CLIENT_ID"
      - "FEDEX_CLIENT_SECRET"
      - "FEDEX_ACCOUNT_NUMBER"
    environments:
      - sandbox: "Testing with fake shipments"
      - production: "Real shipments, requires certification"
    documentation: "https://developer.fedex.com"

# Stories mapping vers PRD

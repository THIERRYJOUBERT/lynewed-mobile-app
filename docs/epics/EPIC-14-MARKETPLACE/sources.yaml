# Edge Functions creees par cet Epic
edge_functions:
  - name: create-stripe-connect-account
    story: S10
    description: "Cree compte Stripe Connect Express et lien onboarding"
    trigger: http

  - name: fedex-calculate-rate
    story: S11
    description: "Calcule frais de port via FedEx Rate API"
    trigger: http

  - name: fedex-create-shipment
    story: S12
    description: "Cree expedition et genere etiquette via FedEx Ship API"
    trigger: http

  - name: fedex-track-shipment
    story: S13
    description: "Recupere statut tracking via FedEx Track API"
    trigger: http_or_cron

  - name: expire-marketplace-offers
    story: S03
    description: "Cron job pour expirer offres > 48h"
    trigger: cron
    schedule: "*/15 * * * *"

  - name: complete-delivered-transactions
    story: S04
    description: "Cron job pour completer transactions livrees > 7 jours"
    trigger: cron
    schedule: "0 0 * * *"


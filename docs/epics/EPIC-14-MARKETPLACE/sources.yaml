# Decisions techniques de cet Epic
decisions:
  - id: D-EPIC14-01
    decision: "Tous montants en USD cents"
    source: "PRD Decision D-07"
    rationale: "Simplifie calculs, evite erreurs float, compatible Stripe/FedEx"

  - id: D-EPIC14-02
    decision: "Commission fixe 10%"
    source: "PRD APP-08"
    rationale: "Simple a calculer, industrie standard pour marketplace"

  - id: D-EPIC14-03
    decision: "Expiration offres 48h"
    source: "PRD APP-08"
    rationale: "Balance entre laisser le temps au vendeur et engagement acheteur"

  - id: D-EPIC14-04
    decision: "7 jours avant completion transaction"
    source: "PRD APP-08"
    rationale: "Protection acheteur pour disputes, standard e-commerce"

  - id: D-EPIC14-05
    decision: "5-10 photos obligatoires par annonce"
    source: "PRD APP-08"
    rationale: "Qualite des annonces, confiance acheteurs"

  - id: D-EPIC14-06
    decision: "Stripe Connect Express (pas Standard ou Custom)"
    source: "PRD APP-08"
    rationale: "Onboarding le plus simple pour vendeurs occasionnels"

  - id: D-EPIC14-07
    decision: "FedEx worldwide shipping"
    source: "PRD APP-08"
    rationale: "Couverture internationale, calcul frais automatique"

  - id: D-EPIC14-08
    decision: "CGVU scroll + checkbox"
    source: "PRD Section 12"
    rationale: "Preuve juridique d'acceptation, conformite RGPD"

  - id: D-EPIC14-09
    decision: "Lynewed non responsable litiges"
    source: "PRD APP-08"
    rationale: "Intermediaire technique uniquement, limite responsabilite"


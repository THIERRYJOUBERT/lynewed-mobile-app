# Risk assessment
risks:
  - risk: "FFmpeg not available on Edge Runtime"
    impact: critical
    mitigation: "Use WASM FFmpeg or external service"

  - risk: "Processing timeout for long videos"
    impact: high
    mitigation: "10 min total limit, 10 min timeout"

  - risk: "Storage costs"
    impact: medium
    mitigation: "7 day retention, aggressive preview compression"

  - risk: "Corrupted video files"
    impact: medium
    mitigation: "Validation before processing, clear error messages"

  - risk: "RLS too permissive"
    impact: high
    mitigation: "Exhaustive testing, adversarial review"

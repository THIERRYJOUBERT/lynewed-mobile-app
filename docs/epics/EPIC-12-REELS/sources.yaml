# Decisions techniques de cet Epic
decisions:
  - id: D-EPIC12-01
    decision: "Guests CAN create reels with their own videos"
    source: "PRD Decision D-14"
    rationale: "Override previous conversation, guests should have this feature"

  - id: D-EPIC12-02
    decision: "FFmpeg MVP approach (not Shotstack)"
    source: "PRD Section 8"
    rationale: "Minimal cost, simple transitions, evaluate before upgrading"

  - id: D-EPIC12-03
    decision: "Preview 480p with central watermark"
    source: "PRD Section 8"
    rationale: "Intentionally low quality to encourage full download"

  - id: D-EPIC12-04
    decision: "Output 1080p with discreet corner logo"
    source: "PRD Section 8"
    rationale: "High quality for social sharing, branding without intrusion"

  - id: D-EPIC12-05
    decision: "7 days retention then auto-delete"
    source: "PRD Section 8"
    rationale: "Control storage costs, reels are temporary"

  - id: D-EPIC12-06
    decision: "Free MVP with payment architecture ready"
    source: "PRD Section 8"
    rationale: "Test market before monetizing, fields is_paid/price_cents"

  - id: D-EPIC12-07
    decision: "Limits: 10 videos, 2min each, 10min total"
    source: "PRD Section 8 - Limites"
    rationale: "Performance and reasonable scope"

# Limites techniques
limits:
  videos_per_reel: 10
  duration_per_video_seconds: 120
  total_duration_seconds: 600
  retention_days: 7
  preview_resolution: "480p"
  output_resolution: "1080p"
  video_format: "MP4 H.264"
  supported_input_formats:
    - "video/mp4"
    - "video/quicktime"
    - "video/x-m4v"

# FFmpeg commands reference
ffmpeg_commands:
  concatenate_with_fade: |
    ffmpeg -f concat -safe 0 -i list.txt \
      -filter_complex "[0:v]fade=t=out:st=DURATION-1:d=1[v0];..." \
      -c:v libx264 -preset medium -crf 23 output_temp.mp4

  preview_480p_watermark: |
    ffmpeg -i input.mp4 \
      -vf "scale=854:480,drawtext=text='LYNEWED':fontsize=72:fontcolor=white@0.5:x=(w-text_w)/2:y=(h-text_h)/2" \
      -c:v libx264 -preset fast -crf 28 preview.mp4

  output_1080p_logo: |
    ffmpeg -i input.mp4 -i logo.png \
      -filter_complex "[0:v]scale=1920:1080[v];[v][1:v]overlay=W-w-20:H-h-20" \
      -c:v libx264 -preset medium -crf 20 output.mp4

# CGVU text reference
cgvu:
  type: "reel"
  version: "1.0"
  checkboxes:
    - id: 1
      title: "OWNERSHIP OF CONTENT"
      text: "I confirm that all videos selected for this reel are my own content, captured by me personally."
    - id: 2
      title: "GENERATED CONTENT"
      text: "I understand that the generated reel becomes my own creation and my personal property."
    - id: 3
      title: "DISTRIBUTION RESPONSIBILITY"
      text: "Any publication, sharing, or distribution of the generated reel is done entirely under my sole responsibility."
    - id: 4
      title: "LYNEWED'S ROLE"
      text: "I acknowledge that Lynewed acts only as a technical processing service and bears no responsibility for how I use the reel."


    story: S06
    dependency_type: FEATURE_FLAG
    description: "minRating filter depends on reviews system being live"

rls_policies:
  - name: "reviews_select_all"
    table: reviews
    operation: SELECT
    description: "Anyone can read reviews"

  - name: "reviews_insert_bride"
    table: reviews
    operation: INSERT
    description: "Only brides can create reviews"
    condition: "auth.uid() = bride_id AND role = 'bride'"

  - name: "reviews_update_own"
    table: reviews
    operation: UPDATE
    description: "Bride can update own review"
    condition: "auth.uid() = bride_id"

notes:
  - "Reviews are internal to Lynewed (not Google Places)"
  - "One review per bride per professional"
  - "No DELETE policy - reviews persist for audit"
  - "minRating filter in EPIC-13 depends on this Epic"

# User Stories from PRD
user_stories:
  - id: US-02.1
    description: "En tant que bride, je peux choisir mes rappels lors de la creation/edition d'un event"
    stories: [S01, S04, S05]

  - id: US-02.2
    description: "En tant que bride, je peux selectionner : 1 semaine, 1 jour, 1 heure (multi-selection)"
    stories: [S05]

  - id: US-02.3
    description: "En tant que bride, je recois une notification push au moment choisi"
    stories: [S03, S06, S07]

  - id: US-02.4
    description: "En tant que bride, je peux modifier/supprimer mes rappels"
    stories: [S05, S06]

# Stories mapping vers PRD
stories:
  - id: S01
    name: "Ajouter colonnes reminder a wedding_events"
    prd_reference: "Section 4 - Modifications base de donnees"
    complexity: S
    domain: DB
    depends_on: []

  - id: S02
    name: "Creer table scheduled_notifications"
    prd_reference: "Section 4 - Table des notifications programmees"
    complexity: S
    domain: DB
    depends_on: []

  - id: S03
    name: "Creer pg_cron job pour traitement notifications"
    prd_reference: "Section 4 - Edge Function (pg_cron)"
    complexity: M
    domain: DB
    depends_on: [S02]

  - id: S04
    name: "Mettre a jour entite WeddingEvent en Dart"
    prd_reference: "Section 4 - Contexte existant (entite Dart)"
    complexity: S
    domain: Dart
    depends_on: [S01]

  - id: S05
    name: "Ajouter checkboxes rappel dans formulaire event"
    prd_reference: "Section 4 - Integration UI"
    complexity: M
    domain: UI
    depends_on: [S04]

  - id: S06
    name: "Implementer scheduling des rappels dans repository"
    prd_reference: "Section 4 - Specifications techniques"
    complexity: M
    domain: Dart
    depends_on: [S02, S04]

  - id: S07
    name: "Integrer avec notifications_outbox existante"
    prd_reference: "Section 4 - Edge Function (pg_cron)"
    complexity: S
    domain: Integration
    depends_on: [S03, S06]

# Decisions techniques de cet Epic
decisions:
  - id: D-EPIC08-01
    decision: "3 rappels fixes (1 semaine, 1 jour, 1 heure)"
    source: "PRD Section 4"
    rationale: "Simplicite UX, couvre 95% des cas d'usage"

  - id: D-EPIC08-02
    decision: "Multi-selection via boolean columns"
    source: "PRD Section 4"
    rationale: "Simple, pas de table de jointure necessaire"

  - id: D-EPIC08-03
    decision: "pg_cron toutes les minutes"
    source: "PRD Section 4"
    rationale: "Precision acceptable, performance OK pour ~100 notifs/jour"

  - id: D-EPIC08-04
    decision: "CASCADE delete sur event_id"
    source: "PRD Section 4 - Criteres d'acceptation"
    rationale: "Pas de notifications orphelines"

  - id: D-EPIC08-05
    decision: "Skip rappels deja passes"
    source: "Best practice"
    rationale: "Si event dans 6h, seul rappel 1h est cree"

  - id: D-EPIC08-06
    decision: "Format message 'Rappel : [titre] dans [duree]'"
    source: "PRD Section 4 - Criteres d'acceptation"
    rationale: "Message clair et concis"


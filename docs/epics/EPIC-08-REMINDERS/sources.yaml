# Validation checklist
validation:
  pre_merge:
    - "All migrations tested on dev branch"
    - "Rollback tested for each migration"
    - "pg_cron job runs correctly"
    - "No orphan notifications possible (CASCADE)"
    - "RLS policies validated with tests"
    - "No flutter analyze warnings"
    - "Production backup created"

  post_merge:
    - "reminder_1_week, reminder_1_day, reminder_1_hour columns exist"
    - "scheduled_notifications table exists"
    - "pg_cron job send-scheduled-notifications is running"
    - "Creating event with reminders creates scheduled_notifications"
    - "Cron job inserts into notifications_outbox"
    - "Push notification received on device"
    - "Deleting event removes scheduled notifications"


code_investigations:
  - feature: invite_code_generation
    files:
      - supabase/migrations/20260129000004_create_generate_invite_code.sql
      - supabase/migrations/20260128000002_add_wedding_invite_columns.sql
      - lib/features/my_wedding/presentation/pages/my_wedding_page.dart
      - lib/features/my_wedding/data/datasources/supabase_my_wedding_datasource.dart
    findings: Trigger BEFORE INSERT OK, but pre-migration weddings have NULL codes

  - feature: fedex_integration
    files:
      - supabase/functions/fedex-create-shipment/fedex-client.ts
      - supabase/functions/fedex-calculate-rate/fedex-client.ts
      - supabase/functions/fedex-track-shipment/fedex-client.ts
      - lib/features/marketplace/data/sizes_data.dart
      - lib/features/marketplace/presentation/pages/checkout_page.dart
    findings: OAuth impl OK, credentials likely not in Supabase secrets. Rate function exists but not wired to checkout.

  - feature: stripe_connect
    files:
      - supabase/functions/create-stripe-connect-account/index.ts
      - supabase/functions/marketplace-create-payment/index.ts
      - supabase/functions/marketplace-payment-webhook/index.ts
    findings: No bugs found. Commission 10% works correctly via destination charges.

  - feature: deep_links
    files:
      - ios/Runner/Runner.entitlements
      - android/app/src/main/AndroidManifest.xml
      - lib/core/navigation/deep_link_handler.dart
    findings: Config correct, missing .well-known files on lynewed.com server

  - feature: guest_upload_cguv
    files:
      - lib/features/guest/presentation/pages/guest_album_page.dart
      - lib/features/marketplace/presentation/widgets/cgvu_acceptance_widget.dart
      - lib/features/my_wedding/presentation/dialogs/magazine_cgvu_dialog.dart
    findings: No CGUV before upload. Infrastructure exists (cgvu_acceptances table, widget). Pattern from magazine dialog reusable.

  - feature: map_stability
    files:
      - lib/features/map/presentation/widgets/lynewed_map_widget.dart
      - lib/features/map/presentation/state/map_state.dart
      - lib/features/map/data/datasources/supabase_map_datasource.dart
      - lib/features/map/presentation/services/marker_icon_generator.dart
    findings: No fallback icon on generation failure. 2000 markers at zoom ≤5 causes OOM. Min zoom 1.0 too low.

  - feature: marketplace_access
    files:
      - lib/features/home/presentation/widgets/nav_bar_pro_widget.dart
      - lib/features/marketplace/presentation/pages/marketplace_feed_page.dart
      - lib/features/marketplace/presentation/widgets/category_chips.dart
    findings: No marketplace tab in pro nav (correct), but no role guard on marketplace route. Only 3 categories (All, Dresses, Shoes).


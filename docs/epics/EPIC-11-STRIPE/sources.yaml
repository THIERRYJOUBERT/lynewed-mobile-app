    - path: "lib/features/payments/domain/entities/purchase.dart"
      story: S11
      description: "Entite Purchase avec tous les champs"

    - path: "lib/features/payments/domain/entities/purchase_status.dart"
      story: S11
      description: "Enum PurchaseStatus"

  repositories:
    - path: "lib/features/payments/domain/repositories/stripe_repository.dart"
      story: S11
      description: "Interface abstraite StripeRepository"

    - path: "lib/features/payments/data/repositories/supabase_stripe_repository.dart"
      story: S11
      description: "Implementation Supabase"

  datasources:
    - path: "lib/features/payments/data/datasources/stripe_datasource.dart"
      story: S11
      description: "Datasource pour queries Supabase"

# Fichiers Edge Function
edge_functions:
  - path: "supabase/functions/stripe-webhook/index.ts"
    story: S04
    description: "Edge Function principale webhook handler"
    secrets_required:
      - "STRIPE_SECRET_KEY"
      - "STRIPE_WEBHOOK_SECRET"
      - "SUPABASE_SERVICE_ROLE_KEY"

# Tests a creer
tests:
  unit:
    - story: S11
      file: "test/features/payments/domain/entities/stripe_account_test.dart"
      cases:
        - "fromJson creates valid entity"
        - "copyWith works correctly"
        - "onboardingComplete computed property"

    - story: S11
      file: "test/features/payments/domain/entities/purchase_test.dart"
      cases:
        - "fromJson with all fields"
        - "fromJson with minimal fields"
        - "commission calculation correct"

  integration:
    - story: S04
      description: "Webhook signature verification"

    - story: S04
      description: "Idempotency - same event twice"

    - story: S05
      description: "payment_intent.succeeded updates purchase"

    - story: S08
      description: "dispute.created triggers notifications"

# RLS Policies a creer
rls_policies:
  stripe_accounts:
    - name: "User sees own stripe account"
      operation: SELECT
      using: "user_id = auth.uid()"
    - name: "User can create own stripe account"
      operation: INSERT
      with_check: "user_id = auth.uid()"

  purchases:
    - name: "Buyer sees own purchases"
      operation: SELECT
      using: "user_id = auth.uid()"
    - name: "Seller sees sales"
      operation: SELECT
      using: "seller_id = auth.uid()"

  stripe_events:
    - name: "No public access"
      operation: ALL
      using: "false"
      note: "Service role only via Edge Function"

# Ordre d'execution recommande
execution_order:
  phase_1:
    name: "Infrastructure Database"
    stories: [S01, S02, S03]
    parallel: true
    blocking: true

  phase_2:
    name: "Edge Function Core"
    stories: [S04]
    depends_on: phase_1
    blocking: true

  phase_3:
    name: "Webhook Handlers"
    stories: [S05, S06, S07, S08, S09, S10]
    depends_on: phase_2
    parallel: true

  phase_4:
    name: "Dart Layer"
    stories: [S11]
    depends_on: phase_1
    parallel_with: phase_3

# Validation checklist
validation:
  pre_merge:
    - "All migrations tested on dev branch"
    - "Rollback tested for each migration"
    - "RLS policies validated with tests"
    - "Edge Function deployed and tested"
    - "Webhook endpoint configured in Stripe Dashboard"
    - "All webhook types tested in Stripe test mode"
    - "No flutter analyze warnings"
    - "Production backup created"

  post_merge:
    - "Tables exist in production"
    - "Edge Function responds to webhooks"
    - "Events logged correctly"
    - "Notifications sent correctly"
    - "Commission calculated correctly"
    - "Documentation updated"

